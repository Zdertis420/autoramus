# Обратная связь: «Замечания» идут от «Контроля» назад в управление «Обработки».
#
# Обратное ребро здесь настоящее: поток производит работа, объявленная позже,
# а потребляет объявленная раньше. Топологическая сортировка обязана его
# разорвать, а раскладка — провести стрелку коридором снаружи лестницы.
# Ни в одной модели проверочного набора обратной связи нарисовано не было,
# и это единственный документ, на котором её маршрут проверяется.
model: Производство
flows: [Сырьё, Регламент, Мастер, Заготовка, Изделие, Замечания]

functions:
  - name: Производство
    in:        [Сырьё]
    control:   [Регламент]
    mechanism: [Мастер]
    out:       [Изделие]

  - name: Обработка
    of: Производство
    in:        [Сырьё]
    control:   [Регламент, Замечания]
    mechanism: [Мастер]
    out:       [Заготовка]

  - name: Контроль
    of: Производство
    in:        [Заготовка]
    control:   [Регламент]
    mechanism: [Мастер]
    out:       [Изделие, Замечания]
