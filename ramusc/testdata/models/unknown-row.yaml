# Ссылочные колонки (Р8): без of ссылка ведёт на работу, с of — на строку
# другого классификатора. Обе ссылки промахнулись на одну букву.
model: Изготовление юбки
flows: [Ткань, Правила изготовления, Швея-закройщица, Юбка]

functions:
  - name: Изготовление юбки
    in:        [Ткань]
    control:   [Правила изготовления]
    mechanism: [Швея-закройщица]
    out:       [Юбка]

classifiers:
  - name: Документы
    columns:
      - name: Название
        type: text
    rows:
      - cells:
          - column: Название
            value: Технический регламент

  - name: Требования
    columns:
      - name: Название
        type: text
      - name: Документ
        type: ref
        of: Документы
      - name: Работа
        type: ref
    rows:
      - cells:
          - column: Название
            value: Припуск на швы
          - column: Документ
            value: Технический регламен
          - column: Работа
            value: Изготовление юбок
