# Проба: воспроизводится ли наложение вообще.
#
# Два потока между одной парой работ, три разных механизма, два разных
# управления. Если правила «середина промежутка» и «общий коридор» дают
# наложение, оно обязано вылезти здесь.
model: Проба
flows: [сырьё, правила, станок, руки, склад, первый, второй, третий, готовое]

functions:
  - name: Проба
    in:        [сырьё]
    control:   [правила]
    mechanism: [станок, руки, склад]
    out:       [готовое]

  - name: Раскрой
    of: Проба
    in:        [сырьё]
    control:   [правила]
    mechanism: [станок]
    out:       [первый, второй]

  - name: Сборка
    of: Проба
    in:        [первый, второй]
    control:   [правила]
    mechanism: [руки]
    out:       [третий]

  - name: Упаковка
    of: Проба
    in:        [третий]
    control:   [правила]
    mechanism: [склад]
    out:       [готовое]
