# Тот же документ, что `testdata/documents/dfd-tunnel.yaml`, но без `tunnel`.
#
# Прежде он проходил проверку молча и давал четыре туннеля в файле:
# `checkDecomposition` пропускал работы с `kind: dfd` целиком. Теперь спрос
# со всех одинаков, и на каждую стрелку, которой некуда идти вглубь, автору
# сказано.
model: Обработка заявок
flows: [Заявка, Регламент, Менеджер, Принятая заявка, Отчёт, Аудитор]

functions:
  - name: Обработка заявок
    in:        [Заявка]
    control:   [Регламент]
    mechanism: [Менеджер, Аудитор]
    out:       [Отчёт]

  - name: Приём заявок
    of: Обработка заявок
    kind: dfd
    in:        [Заявка]
    control:   [Регламент]
    mechanism: [Менеджер]
    out:       [Принятая заявка]

  - name: Заявитель
    of: Приём заявок
    type: external
    out: [Заявка]

  - name: Регистрация
    of: Приём заявок
    in:  [Заявка]
    out: [Принятая заявка]

  - name: Журнал
    of: Приём заявок
    type: store
    in: [Принятая заявка]

  - name: Сведение отчёта
    of: Обработка заявок
    in:        [Принятая заявка]
    control:   [Регламент]
    mechanism: [Аудитор]
    out:       [Отчёт]
