# Поток уходит за край диаграммы, а у её работы такого выхода нет.
#
# «Отход» производит «Обработка», на диаграмме «Производства» его никто не
# потребляет — значит стрелка уйдёт к правому краю листа. Но у самого
# «Производства» выхода «Отход» нет, и перейти на контекстную диаграмму стрелке
# не во что: конец останется без пары, и Ramus нарисует его в скобках.
#
# Баланс снизу вверх проверялся только со стороны потребителя; эта половина
# правила пропускала ровно такие случаи. Молча — а туннель автор потом видел
# в Ramus и не понимал, откуда он.
model: Производство
flows: [Сырьё, Регламент, Мастер, Заготовка, Изделие, Отход]

functions:
  - name: Производство
    in:        [Сырьё]
    control:   [Регламент]
    mechanism: [Мастер]
    out:       [Изделие]

  - name: Обработка
    of: Производство
    in:        [Сырьё]
    control:   [Регламент]
    mechanism: [Мастер]
    out:       [Заготовка, Отход]

  - name: Контроль
    of: Производство
    in:        [Заготовка]
    control:   [Регламент]
    mechanism: [Мастер]
    out:       [Изделие]
