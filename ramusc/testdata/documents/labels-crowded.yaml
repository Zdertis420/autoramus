# Подписи, которым негде встать: названная граница (FR-012 фичи 013).
#
# У последнего блока лестницы семь выходов уходят к правому краю листа. Блок
# стоит в x = 660…732, край — в 793: отрезки выходов по 61 единице. Каждое имя —
# одно длинное слово, переносить нечего, и рамка шириной около 130, прижатая к
# краю листа, обязана залезть на блок по горизонтали. Вверх и вниз средним
# выходам не уйти: подпись держится в 34 единицах от своей линии, а блок
# высотой 120 закрывает эту полосу целиком.
#
# Проверяется, что компилятор не падает, подпись остаётся у своей линии, а
# наложение — там, где его меньше всего, и видно поимённо.
model: Теснота подписей
flows: [сырьё, правила, люди, полуфабрикат,
        Первоочереднейшийрезультат, Второстепеннейшийрезультат,
        Третьестепеннейшийрезультат, Четвертьфинальныйрезультат,
        Пятиступенчатыйрезультатик, Шестиугольнейшийрезультат,
        Семиэтажнейшийрезультатик]

functions:
  - name: Теснота подписей
    in: [сырьё]
    control: [правила]
    mechanism: [люди]
    out: [Первоочереднейшийрезультат, Второстепеннейшийрезультат,
          Третьестепеннейшийрезультат, Четвертьфинальныйрезультат,
          Пятиступенчатыйрезультатик, Шестиугольнейшийрезультат,
          Семиэтажнейшийрезультатик]

  - name: Заготовка
    of: Теснота подписей
    in: [сырьё]
    control: [правила]
    mechanism: [люди]
    out: [полуфабрикат]

  - name: Выпуск
    of: Теснота подписей
    in: [полуфабрикат]
    control: [правила]
    mechanism: [люди]
    out: [Первоочереднейшийрезультат, Второстепеннейшийрезультат,
          Третьестепеннейшийрезультат, Четвертьфинальныйрезультат,
          Пятиступенчатыйрезультатик, Шестиугольнейшийрезультат,
          Семиэтажнейшийрезультатик]
