# Значения не подходят типам колонок (Р8): дата не по формату, long дробный.
model: Изготовление юбки
flows: [Ткань, Правила изготовления, Швея-закройщица, Юбка]

functions:
  - name: Изготовление юбки
    in:        [Ткань]
    control:   [Правила изготовления]
    mechanism: [Швея-закройщица]
    out:       [Юбка]

classifiers:
  - name: Документы
    columns:
      - name: Название
        type: text
      - name: Утверждён
        type: date
      - name: Версия
        type: long
    rows:
      - cells:
          - column: Название
            value: Технический регламент
          - column: Утверждён
            value: "12.05.2024"
          - column: Версия
            value: 1.5
