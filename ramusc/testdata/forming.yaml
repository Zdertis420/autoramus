# Декомпилировано из ../examples/ФормированиеТП.rsf.
# Сегментов стрелок в файле 103, в layout записано 19.
# Остальные упираются в узлы ветвления или висят неприсоединёнными —
# нынешним layout.arrows их не выразить.
model: Формирование технического процесса
author: Ножкин А.М.
page: A4

flows: [Стандарт, Утверждение ТЗ, Уточнение данных,
        Утверждённый эскиз проекта, Программист, Бизнес аналитик,
        Проектировщик, Технический проект, Структура программа,
        'Уточнённая структура и форма представления входных и выходных данных ',
        Конфигурация технических средств,
        Комлекти систематизированных исходных материалов,
        Раздел "основные техничиеские решения",
        Раздел "Мероприятия по подготовке объекта",
        Комлекты систематизированных исходных материалов]

functions:
  - name: Формирование технического процесса
    in:        [Утверждение ТЗ, Уточнение данных, Утверждённый эскиз проекта]
    control:   [Стандарт]
    mechanism: [Программист, Бизнес аналитик, Проектировщик]
    out:       [Технический проект]

  - name: 'Уточнение структуры и формы представления входных и выходных данных
'
    of: Формирование технического процесса
    in:        [Уточнение данных, Утверждённый эскиз проекта, Утверждение ТЗ]
    control:   [Стандарт]
    mechanism: [Бизнес аналитик]
    out:       ['Уточнённая структура и форма представления входных и выходных данных ']

  - name: Разработка структуры программы
    of: Формирование технического процесса
    in:        [Утверждённый эскиз проекта,
                'Уточнённая структура и форма представления входных и выходных данных ']
    control:   [Стандарт]
    mechanism: [Бизнес аналитик, Программист]
    out:       [Структура программа]

  - name: Определение конфигурации технических средств
    of: Формирование технического процесса
    in:        [Утверждение ТЗ, Структура программа]
    control:   [Стандарт]
    mechanism: [Проектировщик, Программист]
    out:       [Конфигурация технических средств]

  - name: Подготовка Поянительной записки к ТП
    of: Формирование технического процесса
    in:        [Конфигурация технических средств,
                'Уточнённая структура и форма представления входных и выходных данных ',
                Структура программа]
    control:   [Стандарт]
    mechanism: [Бизнес аналитик]
    out:       [Технический проект]

  - name: Сбор и систематизация проектных решений предыдущих этапов
    of: Подготовка Поянительной записки к ТП
    in:        [Конфигурация технических средств,
                'Уточнённая структура и форма представления входных и выходных данных ',
                Структура программа]
    control:   [Стандарт]
    mechanism: [Бизнес аналитик]
    out:       [Комлекты систематизированных исходных материалов]

  - name: Разработка описания основных технических решений
    of: Подготовка Поянительной записки к ТП
    in:        [Комлекты систематизированных исходных материалов]
    control:   [Стандарт]
    mechanism: [Бизнес аналитик]
    out:       [Раздел "основные техничиеские решения"]

  - name: Разработка по подготовке объекта автоматизации к вводу системы в действие
    of: Подготовка Поянительной записки к ТП
    in:        [Раздел "основные техничиеские решения"]
    control:   [Стандарт]
    mechanism: [Бизнес аналитик]
    out:       [Раздел "Мероприятия по подготовке объекта"]

  - name: Оформление, нормконтроль и утверждение пояснительной записки
    of: Подготовка Поянительной записки к ТП
    in:        [Раздел "Мероприятия по подготовке объекта"]
    control:   [Стандарт]
    mechanism: [Бизнес аналитик]
    out:       [Технический проект]

