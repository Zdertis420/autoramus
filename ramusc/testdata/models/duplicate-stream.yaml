# Атрибуты «Ткани» описаны двумя записями streams: какая из них верна, неясно.
model: Изготовление юбки
flows: [Ткань, Правила, Швея, Юбка]

streams:
  - name: Ткань
    note: рулонная

  - name: Ткань
    note: штучная

functions:
  - name: Изготовление юбки
    in:        [Ткань]
    control:   [Правила]
    mechanism: [Швея]
    out:       [Юбка]
