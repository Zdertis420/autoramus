# Поток, который и потребляется внутри диаграммы, и уходит за её край.
#
# Давит на одно место — проверку `consumed` в `arrow.go: diagramArrows()`.
# «Журнал» производит «Обработка», потребляет «Сборка», и он же объявлен в
# `out` у «Пробы», то есть обязан дойти до правого края листа. Половинка
# «работа → наружу» отбрасывается, как только у потока нашёлся потребитель
# внутри, и выход диаграммы пропадает молча.
#
# Ожидаемо до фичи: сегментов до правого края листа у «журнала» — ноль,
# секторов у него на диаграмме «Проба» — один (к «Сборке»).
# Ожидаемо после: сегмент до края есть, и оба идут от общего узла.
#
# Ни один документ прежнего набора этого не воспроизводит: там поток либо
# живёт внутри диаграммы целиком, либо объявлен туннелем (`dfd-tunnel.yaml`,
# `skirt-full.yaml`), и ветки на край не требует.
model: Проба
flows: [сырьё, правила, руки, заготовка, журнал, готовое]

functions:
  - name: Проба
    in:        [сырьё]
    control:   [правила]
    mechanism: [руки]
    out:       [готовое, журнал]

  - name: Обработка
    of: Проба
    in:        [сырьё]
    control:   [правила]
    mechanism: [руки]
    out:       [заготовка, журнал]

  - name: Сборка
    of: Проба
    in:        [заготовка, журнал]
    control:   [правила]
    mechanism: [руки]
    out:       [готовое]
