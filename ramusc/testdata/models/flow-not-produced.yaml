# «Клей» потребляется работой на декомпозиции, но на этой диаграмме его никто
# не производит, и к родительской работе он тоже не приходит: стрелка взялась
# из ниоткуда.
model: Изготовление юбки
flows: [Ткань, Правила, Швея, Юбка, Клей, Детали]

functions:
  - name: Изготовление юбки
    in:        [Ткань]
    control:   [Правила]
    mechanism: [Швея]
    out:       [Юбка]

  - name: Раскрой
    of: Изготовление юбки
    in:        [Ткань]
    control:   [Правила]
    mechanism: [Швея]
    out:       [Детали]

  - name: Сшивание
    of: Изготовление юбки
    in:        [Детали, Клей]
    control:   [Правила]
    mechanism: [Швея]
    out:       [Юбка]
