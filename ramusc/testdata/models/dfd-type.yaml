# Хранилище — элемент DFD, но у родителя не указан kind: dfd (Р8).
model: Обработка заказов
flows: [Заказ, Регламент, Менеджер, Отчёт]

functions:
  - name: Обработка заказов
    in:        [Заказ]
    control:   [Регламент]
    mechanism: [Менеджер]
    out:       [Отчёт]

  - name: Регистрация заказа
    of: Обработка заказов
    in:        [Заказ]
    control:   [Регламент]
    mechanism: [Менеджер]
    out:       [Отчёт]

  - name: Архив заказов
    of: Обработка заказов
    type: store
    in: [Заказ]
