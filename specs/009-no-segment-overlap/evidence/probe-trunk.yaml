# Проба 3: две ветвящиеся граничные стрелки одной стороны. Магистраль у обеих
# считается одинаково (trunkAt), значит обязана совпасть.
model: Проба3
flows: [сырьё, правила, нормы, руки, станок, a1, a2, готовое]

functions:
  - name: Проба3
    in: [сырьё]
    control: [правила, нормы]
    mechanism: [руки, станок]
    out: [готовое]

  - name: Первая
    of: Проба3
    in: [сырьё]
    control: [правила, нормы]
    mechanism: [руки, станок]
    out: [a1]

  - name: Вторая
    of: Проба3
    in: [a1]
    control: [правила, нормы]
    mechanism: [руки, станок]
    out: [a2]

  - name: Третья
    of: Проба3
    in: [a2]
    control: [правила, нормы]
    mechanism: [руки, станок]
    out: [готовое]
