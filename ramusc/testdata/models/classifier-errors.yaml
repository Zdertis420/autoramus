model: Изготовление юбки
flows: [Ткань, Правила изготовления, Швея-закройщица, Юбка]

functions:
  - name: Изготовление юбки
    in:        [Ткань]
    control:   [Правила изготовления]
    mechanism: [Швея-закройщица]
    out:       [Юбка]

classifiers:
  - name: Документы
    columns:
      - name: Название
        type: text
      - name: Название
        type: text
      - name: Работа
        type: ref
        of: Работы
      - name: Версия
        type: long
        of: Документы
    rows:
      - cells:
          - column: Название
            value: Технический регламент
          - column: Название
            value: Инструкция
          - column: Названье
            value: Что-то ещё
