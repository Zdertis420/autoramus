# Декомпозиция диаграммой потоков данных с явным туннелем.
#
# На диаграмме DFD граничных стрелок не рисуют: цеплять их не к чему — у
# внешней сущности и хранилища сторон ICOM нет. Значит все четыре стрелки
# «Приёма заявок» на родительской диаграмме кончаются в скобках, и автор
# говорит об этом сам полем tunnel. Убери его — и компилятор потребует
# декомпозиции: тем и отличается «я так задумал» от «я забыл дописать».
#
# Документ валиден и обязан собираться без единого замечания. Туннелей в
# собранном файле ровно четыре — по числу объявленных.
model: Обработка заявок
flows: [Заявка, Регламент, Менеджер, Принятая заявка, Отчёт, Аудитор]

functions:
  - name: Обработка заявок
    in:        [Заявка]
    control:   [Регламент]
    mechanism: [Менеджер, Аудитор]
    out:       [Отчёт]

  - name: Приём заявок
    of: Обработка заявок
    kind: dfd
    in:        [Заявка]
    control:   [Регламент]
    mechanism: [Менеджер]
    out:       [Принятая заявка]
    tunnel:    [Заявка, Регламент, Менеджер, Принятая заявка]

  - name: Заявитель
    of: Приём заявок
    type: external
    out: [Заявка]

  - name: Регистрация
    of: Приём заявок
    in:  [Заявка]
    out: [Принятая заявка]

  - name: Журнал
    of: Приём заявок
    type: store
    in: [Принятая заявка]

  - name: Сведение отчёта
    of: Обработка заявок
    in:        [Принятая заявка]
    control:   [Регламент]
    mechanism: [Аудитор]
    out:       [Отчёт]
