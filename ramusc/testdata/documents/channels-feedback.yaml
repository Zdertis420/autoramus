# Четыре обратные связи: две на управление, две на вход.
#
# Давит сразу на два правила и на их стык:
#
#   * коридоры `route.go: corridorAbove()` и `corridorBelow()` — одна
#     горизонталь на всю диаграмму, сколько бы стрелок её ни спросило;
#   * вертикаль разворота `feedback()`: `turn = from.x + stub`, а `from.x` у всех
#     четырёх — правый край одной и той же «Третьей».
#
# Стык важнее обоих: «назад» разворачивается и «вниз» разворачивается на одной
# вертикали, хотя дальше расходятся в разные коридоры. Такое наложение правкой
# отдельных формул не ловится — только общим проходом, который видит все
# координаты сразу.
#
# До разведения — 7 наложений при 21 стрелке; больше, чем даёт любое другое
# правило.
model: Проба2
flows: [сырьё, правила, руки, a1, a2, назад1, назад2, вниз1, вниз2, готовое]

functions:
  - name: Проба2
    in: [сырьё]
    control: [правила]
    mechanism: [руки]
    out: [готовое]

  - name: Первая
    of: Проба2
    in: [сырьё, вниз1]
    control: [правила, назад1]
    mechanism: [руки]
    out: [a1]

  - name: Вторая
    of: Проба2
    in: [a1, вниз2]
    control: [правила, назад2]
    mechanism: [руки]
    out: [a2]

  - name: Третья
    of: Проба2
    in: [a2]
    control: [правила]
    mechanism: [руки]
    out: [назад1, назад2, вниз1, вниз2, готовое]
