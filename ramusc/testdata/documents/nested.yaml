# Три уровня: A-0, A0 и декомпозиция «Обработки».
#
# «Резак» объявлен на всех трёх уровнях не для красоты: валидатор требует,
# чтобы механизм дочерней работы приходил к родителю той же стороной, иначе
# стрелке неоткуда взяться. Поэтому один механизм даёт цепочку из трёх
# секторов на трёх диаграммах — на ней и проверяется сшивка уровней общим
# кросспоинтом.
model: Производство
flows: [Сырьё, Регламент, Мастер, Заготовка, Изделие, Резак, Черновик]

functions:
  - name: Производство
    in:        [Сырьё]
    control:   [Регламент]
    mechanism: [Мастер, Резак]
    out:       [Изделие]

  - name: Обработка
    of: Производство
    in:        [Сырьё]
    control:   [Регламент]
    mechanism: [Мастер, Резак]
    out:       [Заготовка]

  - name: Контроль
    of: Производство
    in:        [Заготовка]
    control:   [Регламент]
    mechanism: [Мастер]
    out:       [Изделие]

  - name: Раскрой
    of: Обработка
    in:        [Сырьё]
    control:   [Регламент]
    mechanism: [Мастер, Резак]
    out:       [Черновик]

  - name: Доводка
    of: Обработка
    in:        [Черновик]
    control:   [Регламент]
    mechanism: [Мастер]
    out:       [Заготовка]
