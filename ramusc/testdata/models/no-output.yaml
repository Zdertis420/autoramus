# У работы есть вход, управление и механизм, но нет выхода — она ничего
# не производит. Заодно «Обрезки» объявлены, но нигде не используются:
# это предупреждение, а не ошибка.
model: Изготовление юбки
flows: [Ткань, Правила изготовления, Швея-закройщица, Обрезки]

functions:
  - name: Изготовление юбки
    in:        [Ткань]
    control:   [Правила изготовления]
    mechanism: [Швея-закройщица]
