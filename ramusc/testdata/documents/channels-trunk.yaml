# Два управления и два механизма, каждый ветвится к трём работам.
#
# Давит на магистраль ветвления (`tree.go: trunkAt()`). Магистраль считается по
# геометрии блоков — середина промежутка между краем листа и ближайшим краем
# лестницы — и от потока не зависит **вовсе**. Значит у двух потоков одной
# стороны она совпадает всегда, и совпадает целиком: все сегменты магистрали
# разом.
#
# То же самое, но крупнее, видно на `examples/chakhokhbili.yaml`: там четыре
# механизма ложатся на одну линию `y=404.7` и дают 23 наложения из 25. Здесь
# случай выделен в чистом виде, чтобы по имени упавшего документа было видно,
# какое именно правило не сработало.
#
# До разведения — 6 наложений.
model: Проба3
flows: [сырьё, правила, нормы, руки, станок, a1, a2, готовое]

functions:
  - name: Проба3
    in: [сырьё]
    control: [правила, нормы]
    mechanism: [руки, станок]
    out: [готовое]

  - name: Первая
    of: Проба3
    in: [сырьё]
    control: [правила, нормы]
    mechanism: [руки, станок]
    out: [a1]

  - name: Вторая
    of: Проба3
    in: [a1]
    control: [правила, нормы]
    mechanism: [руки, станок]
    out: [a2]

  - name: Третья
    of: Проба3
    in: [a2]
    control: [правила, нормы]
    mechanism: [руки, станок]
    out: [готовое]
