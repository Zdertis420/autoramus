# Явная форма связи (Р7): у первой нет ни одного конца, у второй концы лежат
# на разных диаграммах.
model: Изготовление юбки
flows: [Ткань, Правила изготовления, Швея-закройщица, Юбка]

functions:
  - name: Изготовление юбки
    in:        [Ткань]
    control:   [Правила изготовления]
    mechanism: [Швея-закройщица]
    out:       [Юбка]

  - name: Раскрой материала
    of: Изготовление юбки
    in:        [Ткань]
    control:   [Правила изготовления]
    mechanism: [Швея-закройщица]
    out:       [Юбка]

  - name: Обмеловка
    of: Раскрой материала
    in:        [Ткань]
    control:   [Правила изготовления]
    mechanism: [Швея-закройщица]
    out:       [Юбка]

links:
  - flow: Юбка

  - flow: Юбка
    from: Раскрой материала
    to: Обмеловка
