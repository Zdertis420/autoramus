# arrow_through_block: автор провёл стрелку сквозь блок.
#
# Документ валиден и собирается. Лестница из трёх работ ставит «Середину» в
# 370…442 × 201…251.4. Автор нарисовал «заготовку» сам: из выхода «Начала»
# вправо до x = 400, вниз, и назад влево — ко входу «Середины». Вертикаль на
# x = 400 заходит в «Середину» сверху, а обратная горизонталь идёт внутри неё.
# Авторские точки раскладка не трогает (Р2), и сказать об этом можно только
# предупреждением: одно на сегмент, с позицией точки, с которой начинается
# отрезок, идущий сквозь блок.
model: Проба
flows: [сырьё, указание, исполнитель, заготовка, деталь, изделие]

functions:
  - name: Проба
    in: [сырьё]
    control: [указание]
    mechanism: [исполнитель]
    out: [изделие]

  - name: Начало
    of: Проба
    in: [сырьё]
    control: [указание]
    mechanism: [исполнитель]
    out: [заготовка]

  - name: Середина
    of: Проба
    in: [заготовка]
    control: [указание]
    mechanism: [исполнитель]
    out: [деталь]

  - name: Конец
    of: Проба
    in: [деталь]
    control: [указание]
    mechanism: [исполнитель]
    out: [изделие]

layout:
  arrows:
    - flow: заготовка
      segments:
        - on: Проба
          from: {function: Начало, side: out}
          to:   {function: Середина, side: in}
          points: [[152, 105.2], [400, 105.2], [400, 226.4], [370, 226.4]]
