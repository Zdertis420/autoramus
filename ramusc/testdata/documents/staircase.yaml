# Аналог `examples/тест.rsf`: четыре подработы цепочкой.
#
# Ramus разложил ту модель сам, и её числа — эталон. Здесь повторена её
# структура, чтобы сверять маршруты: блоки обязаны встать на ту же диагональ,
# а вертикали прямых связей — в те же 212⅔, 406 и 599⅓.
#
# Внутренние стрелки в самой `тест.rsf` нарисованы мышью и потому безымянны;
# точки их крепления к блокам — там, где пришлось пользователю. Сверяются
# поэтому не они, а середины промежутков, которые Ramus считает сам.
model: Работа
flows: [вход1, контроль, механизм, между12, между23, между34, выход]

functions:
  - name: Работа
    in:        [вход1]
    control:   [контроль]
    mechanism: [механизм]
    out:       [выход]

  - name: Первая
    of: Работа
    in:        [вход1]
    control:   [контроль]
    mechanism: [механизм]
    out:       [между12]

  - name: Вторая
    of: Работа
    in:        [между12]
    control:   [контроль]
    mechanism: [механизм]
    out:       [между23]

  - name: Третья
    of: Работа
    in:        [между23]
    control:   [контроль]
    mechanism: [механизм]
    out:       [между34]

  - name: Четвёртая
    of: Работа
    in:        [между34]
    control:   [контроль]
    mechanism: [механизм]
    out:       [выход]
