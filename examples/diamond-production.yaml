model: Производство бриллиантов
author: Пример
page: A4

flows: [Кимберлитовая руда, Алмазосодержащий концентрат, Необработанные алмазы,
        Размеченный алмаз, Алмазная заготовка, Округлённая заготовка,
        Ограненный алмаз, Бриллиант,
        Технический регламент добычи, Стандарты сортировки алмазов,
        Стандарты огранки бриллиантов GIA,
        Горнодобывающее оборудование, Обогатительное оборудование,
        Разметочное оборудование, Распиловочное оборудование,
        Обдирочное оборудование, Гранильный станок, Полировальное оборудование,
        Персонал предприятия]

functions:
  - name: Производство бриллиантов
    in:        [Кимберлитовая руда]
    control:   [Технический регламент добычи, Стандарты сортировки алмазов,
                Стандарты огранки бриллиантов GIA]
    mechanism: [Горнодобывающее оборудование, Обогатительное оборудование,
                Разметочное оборудование, Распиловочное оборудование,
                Обдирочное оборудование, Гранильный станок,
                Полировальное оборудование, Персонал предприятия]
    out:       [Бриллиант]

  - name: Добыча алмазной руды
    of: Производство бриллиантов
    in:        [Кимберлитовая руда]
    control:   [Технический регламент добычи]
    mechanism: [Горнодобывающее оборудование, Персонал предприятия]
    out:       [Алмазосодержащий концентрат]
    note: Карьерная или шахтная добыча кимберлитовой руды

  - name: Выделение алмазов
    of: Производство бриллиантов
    in:        [Алмазосодержащий концентрат]
    control:   [Стандарты сортировки алмазов]
    mechanism: [Обогатительное оборудование, Персонал предприятия]
    out:       [Необработанные алмазы]
    note: Дробление, обогащение (рентгенолюминесцентная и жировая сепарация) и сортировка

  - name: Огранка и полировка
    of: Производство бриллиантов
    in:        [Необработанные алмазы]
    control:   [Стандарты огранки бриллиантов GIA]
    mechanism: [Разметочное оборудование, Распиловочное оборудование,
                Обдирочное оборудование, Гранильный станок,
                Полировальное оборудование, Персонал предприятия]
    out:       [Бриллиант]

  - name: Разметка камня
    of: Огранка и полировка
    in:        [Необработанные алмазы]
    control:   [Стандарты огранки бриллиантов GIA]
    mechanism: [Разметочное оборудование, Персонал предприятия]
    out:       [Размеченный алмаз]
    note: Определение оптимальной схемы раскроя по включениям и форме кристалла

  - name: Распиловка и раскалывание
    of: Огранка и полировка
    in:        [Размеченный алмаз]
    control:   [Стандарты огранки бриллиантов GIA]
    mechanism: [Распиловочное оборудование, Персонал предприятия]
    out:       [Алмазная заготовка]

  - name: Обдирка
    of: Огранка и полировка
    in:        [Алмазная заготовка]
    control:   [Стандарты огранки бриллиантов GIA]
    mechanism: [Обдирочное оборудование, Персонал предприятия]
    out:       [Округлённая заготовка]
    note: Придание заготовке округлой формы будущего бриллианта (браутинг)

  - name: Огранка граней
    of: Огранка и полировка
    in:        [Округлённая заготовка]
    control:   [Стандарты огранки бриллиантов GIA]
    mechanism: [Гранильный станок, Персонал предприятия]
    out:       [Ограненный алмаз]

  - name: Полировка
    of: Огранка и полировка
    in:        [Ограненный алмаз]
    control:   [Стандарты огранки бриллиантов GIA]
    mechanism: [Полировальное оборудование, Персонал предприятия]
    out:       [Бриллиант]
