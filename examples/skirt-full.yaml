# Тот же цех, что и в skirt.yaml, но со всеми секциями языка: атрибуты потоков,
# явные связи, классификаторы, люк raw, ветка DFD и ручная раскладка.
# Документ намеренно проходит проверку без единого замечания — по Р14 такие
# примеры служат образцами для нейросети.
#
# ICOM выписан целиком: у каждой работы IDEF0 есть вход, управление, механизм
# и выход, а всё, что приходит к дочерней работе с границы листа, есть у
# родителя той же стороной. Сверено с examples/ИзготовлениеЮбки.rsf.
model: Изготовление юбки
author: Ножкин А.М.
page: A4

flows: [Ткань, Фурнитура, Правила изготовления, Швея-закройщица,
        Выкройка, Раскройное оборудование, Швейная машинка,
        Швейно-вышивальная машинка, Детали изделия, Карта раскроя,
        Собранное изделие, Юбка,
        Заявка, Заявка в работе, Регламент приёма, Менеджер]

# Словарь потоков — это flows; сюда попадает только то, у чего есть что сказать
# сверх имени (Р12).
streams:
  - name: Юбка
    note: Готовое изделие, выход модели

  - name: Выкройка
    note: Лекала, по которым идёт раскрой
    raw:
      - attribute: F_STATUS
        value: 0

functions:
  - name: Изготовление юбки
    in:        [Ткань, Фурнитура, Заявка]
    control:   [Правила изготовления, Регламент приёма]
    mechanism: [Швея-закройщица, Раскройное оборудование, Выкройка,
                Швейная машинка, Швейно-вышивальная машинка, Менеджер]
    out:       [Юбка]

  - name: Раскрой материала
    of: Изготовление юбки
    in:        [Ткань]
    control:   [Правила изготовления]
    mechanism: [Швея-закройщица, Раскройное оборудование, Выкройка]
    out:       [Детали изделия, Карта раскроя]
    note: Ручной раскрой по лекалам
    raw:
      - attribute: F_DECOMPOSITION_TYPE
        value: -1

  - name: Сшивание деталей
    of: Изготовление юбки
    in:        [Детали изделия]
    control:   [Правила изготовления]
    mechanism: [Швея-закройщица, Швейная машинка]
    out:       [Собранное изделие]

  - name: Добавление фурнитуры
    of: Изготовление юбки
    in:        [Собранное изделие, Фурнитура]
    control:   [Правила изготовления]
    mechanism: [Швея-закройщица, Швейно-вышивальная машинка]
    out:       [Юбка]

  # Декомпозиция этой работы рисуется как диаграмма потоков данных (Р8).
  # Сама работа остаётся обычным блоком IDEF0 со всеми четырьмя сторонами.
  - name: Приём заказа
    of: Изготовление юбки
    kind: dfd
    in:        [Заявка]
    control:   [Регламент приёма]
    mechanism: [Менеджер]
    out:       [Заявка в работе]

  # Элементы DFD: здесь ICOM нет, есть только «откуда — куда».
  - name: Заказчик
    of: Приём заказа
    type: external
    out: [Заявка]

  - name: Регистрация заявки
    of: Приём заказа
    in:  [Заявка]
    out: [Заявка в работе]

  - name: Журнал заявок
    of: Приём заказа
    type: store
    in: [Заявка в работе]

# Общая форма связи (Р7) закрывает нетипичные случаи: здесь выход одного блока
# управляет соседним, а списками in/control/out такое не записать.
links:
  - flow: Карта раскроя
    from: Раскрой материала
    to: Сшивание деталей
    side: control
    note: Раскладка деталей задаёт порядок сборки

classifiers:
  - name: Документы
    columns:
      - name: Название
        type: text
      - name: Утверждён
        type: date
      - name: Версия
        type: long
      - name: Действует
        type: bool
      - name: Работа
        type: ref
    rows:
      - cells:
          - column: Название
            value: Технический регламент
          - column: Утверждён
            value: 2024-05-12
          - column: Версия
            value: 3
          - column: Действует
            value: true
          - column: Работа
            value: Раскрой материала
        note: Привязка строки к работе — это колонка типа ref, отдельного синтаксиса не нужно

  - name: Требования
    columns:
      - name: Название
        type: text
      - name: Документ
        type: ref
        of: Документы
      - name: Работы
        type: list
    rows:
      - cells:
          - column: Название
            value: Припуск на швы 10 мм
          - column: Документ
            value: Технический регламент
          - column: Работы
            value: [Раскрой материала, Сшивание деталей]

# Оверрайд автораскладки (Р2). Автор её обычно не пишет — это работа
# декомпилятора; здесь секция показана целиком ради формата.
layout:
  functions:
    - function: Раскрой материала
      x: 90
      y: 102
      width: 138
      height: 72

    - function: Сшивание деталей
      x: 369
      y: 201
      width: 102
      height: 75

  # Стрелка — это дерево сегментов, сшитых узлами. Имена узлов свои у каждой
  # стрелки и ничего не значат: это просто метки.
  arrows:
    - flow: Детали изделия
      segments:
        - on: Изготовление юбки
          from: {function: Раскрой материала, side: out}
          to:   {function: Сшивание деталей, side: in}
          points: [[228, 138], [300, 138], [300, 238]]

    # Управление приходит с верхнего края листа и ветвится на две работы.
    - flow: Правила изготовления
      segments:
        - on: Изготовление юбки
          from: {border: top}
          to:   {node: n1}
          points: [[300, 40], [300, 80]]

        - on: Изготовление юбки
          from: {node: n1}
          to:   {function: Раскрой материала, side: control}
          points: [[300, 80], [159, 80], [159, 102]]

        - on: Изготовление юбки
          from: {node: n1}
          to:   {function: Сшивание деталей, side: control}
          points: [[300, 80], [420, 80], [420, 201]]
