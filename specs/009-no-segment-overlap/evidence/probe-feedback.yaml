# Проба 2: два коридора. Две обратные связи на управление (коридор над
# лестницей) и две — на вход (коридор под лестницей).
model: Проба2
flows: [сырьё, правила, руки, a1, a2, назад1, назад2, вниз1, вниз2, готовое]

functions:
  - name: Проба2
    in: [сырьё]
    control: [правила]
    mechanism: [руки]
    out: [готовое]

  - name: Первая
    of: Проба2
    in: [сырьё, вниз1]
    control: [правила, назад1]
    mechanism: [руки]
    out: [a1]

  - name: Вторая
    of: Проба2
    in: [a1, вниз2]
    control: [правила, назад2]
    mechanism: [руки]
    out: [a2]

  - name: Третья
    of: Проба2
    in: [a2]
    control: [правила]
    mechanism: [руки]
    out: [назад1, назад2, вниз1, вниз2, готовое]
