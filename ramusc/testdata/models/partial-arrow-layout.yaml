# Оверрайд `layout.arrows`, покрывший диаграмму не до конца.
#
# Единица оверрайда — пара «поток + диаграмма»: взявшись рисовать «Регламент»
# на диаграмме «Производства», автор отвечает там за все его связи. Ветка
# к «Контролю» не нарисована, и без сообщения она просто не попала бы в файл.
#
# На контекстной диаграмме тот же «Регламент» не описан вовсе — и это не
# ошибка: там его по-прежнему рисует раскладка. Ровно ради этого гранулярность
# и менялась.
model: Производство
flows: [Сырьё, Регламент, Мастер, Заготовка, Изделие]

functions:
  - name: Производство
    in:        [Сырьё]
    control:   [Регламент]
    mechanism: [Мастер]
    out:       [Изделие]

  - name: Обработка
    of: Производство
    in:        [Сырьё]
    control:   [Регламент]
    mechanism: [Мастер]
    out:       [Заготовка]

  - name: Контроль
    of: Производство
    in:        [Заготовка]
    control:   [Регламент]
    mechanism: [Мастер]
    out:       [Изделие]

layout:
  arrows:
    - flow: Регламент
      segments:
        - on: Производство
          from: {border: top}
          to:   {function: Обработка, side: control}
          points: [[116, 7], [116, 80]]
