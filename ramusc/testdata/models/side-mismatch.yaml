# Граничная стрелка меняет сторону: к родителю «Технические условия» приходят
# управлением, а внутри декомпозиции работа берёт их входом.
model: Изготовление юбки
flows: [Ткань, Правила изготовления, Технические условия, Швея-закройщица, Юбка]

functions:
  - name: Изготовление юбки
    in:        [Ткань]
    control:   [Правила изготовления, Технические условия]
    mechanism: [Швея-закройщица]
    out:       [Юбка]

  - name: Раскрой материала
    of: Изготовление юбки
    in:        [Ткань, Технические условия]
    control:   [Правила изготовления]
    mechanism: [Швея-закройщица]
    out:       [Юбка]
