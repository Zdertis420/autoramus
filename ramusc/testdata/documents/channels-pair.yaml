# Два потока между одной парой работ.
#
# Давит на одно правило — вертикаль прямой связи (`route.go: middle()`).
# Промежуток между «Раскроем» и «Сборкой» один, середина у него одна, и оба
# потока получают её же: до разведения по каналам их вертикали накладываются на
# 104.2 по высоте.
#
# Ни один документ прежнего набора такой пары не содержал: там поток между парой
# работ всегда ровно один, и дефект не воспроизводился вовсе.
model: Проба
flows: [сырьё, правила, станок, руки, склад, первый, второй, третий, готовое]

functions:
  - name: Проба
    in:        [сырьё]
    control:   [правила]
    mechanism: [станок, руки, склад]
    out:       [готовое]

  - name: Раскрой
    of: Проба
    in:        [сырьё]
    control:   [правила]
    mechanism: [станок]
    out:       [первый, второй]

  - name: Сборка
    of: Проба
    in:        [первый, второй]
    control:   [правила]
    mechanism: [руки]
    out:       [третий]

  - name: Упаковка
    of: Проба
    in:        [третий]
    control:   [правила]
    mechanism: [склад]
    out:       [готовое]
