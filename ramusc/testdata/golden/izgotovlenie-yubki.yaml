# Декомпилировано из ../../../examples/ИзготовлениеЮбки.rsf.
# Сегментов стрелок в файле 45, в layout записано 18.
# Остальные упираются в узлы ветвления или висят неприсоединёнными —
# нынешним layout.arrows их не выразить.
# Потоки без единой стрелки (3): Раскройного оборудования, Выкройки, Швейной машинки.
# Так и лежат в файле — обычно остатки переименования. Они объявлены
# в flows, поэтому validate даст на них предупреждение unused_flow.
model: Изготовление юбки
author: Ножкин А.М.
page: A4

flows: [Ткань, Фурнитура, Правила изготовления швейного изделия,
        Швея-закройшица, Раскройного оборудования, Выкройки, Швейной машинки,
        Юбка, Детали изделия, Собранное изделие, Швейная машинка,
        Раскройное оборудование, Выкройка, Швеёно-вышивальгая машинка]

functions:
  - name: Изготовление юбки
    in:        [Ткань, Фурнитура]
    control:   [Правила изготовления швейного изделия]
    mechanism: [Швея-закройшица, Раскройное оборудование, Выкройка,
                Швейная машинка, Швеёно-вышивальгая машинка]
    out:       [Юбка]

  - name: Раскрой материала
    of: Изготовление юбки
    in:        [Ткань]
    control:   [Правила изготовления швейного изделия]
    mechanism: [Раскройное оборудование, Выкройка, Швея-закройшица]
    out:       [Детали изделия]

  - name: Сшивание деталей
    of: Изготовление юбки
    in:        [Детали изделия]
    control:   [Правила изготовления швейного изделия]
    mechanism: [Швейная машинка, Швея-закройшица]
    out:       [Собранное изделие]

  - name: Добавление фурнитуры
    of: Изготовление юбки
    in:        [Собранное изделие, Фурнитура]
    control:   [Правила изготовления швейного изделия]
    mechanism: [Швея-закройшица, Швеёно-вышивальгая машинка]
    out:       [Юбка]

layout:
  functions:
    - function: Изготовление юбки
      x: 288
      y: 147
      width: 186
      height: 144

    - function: Раскрой материала
      x: 90
      y: 102
      width: 138
      height: 72

    - function: Сшивание деталей
      x: 369
      y: 201
      width: 102
      height: 75

    - function: Добавление фурнитуры
      x: 624
      y: 288
      width: 108
      height: 84
  arrows:
    - flow: Швея-закройшица
      on: Изготовление юбки
      context: true
      to: Изготовление юбки
      points: [[319, 437], [319, 291]]

    - flow: Раскройное оборудование
      on: Изготовление юбки
      to: Раскрой материала
      points: [[130.58823529411765, 437], [130.58823529411765, 174]]

    - flow: Раскройное оборудование
      on: Изготовление юбки
      context: true
      to: Изготовление юбки
      points: [[350, 437], [350, 291]]

    - flow: Выкройка
      on: Изготовление юбки
      to: Раскрой материала
      points: [[110.29411764705883, 437], [110.29411764705883, 174]]

    - flow: Выкройка
      on: Изготовление юбки
      context: true
      to: Изготовление юбки
      points: [[381, 437], [381, 291]]

    - flow: Швейная машинка
      on: Изготовление юбки
      to: Сшивание деталей
      points: [[440, 437], [440, 276]]

    - flow: Швейная машинка
      on: Изготовление юбки
      context: true
      to: Изготовление юбки
      points: [[412, 437], [412, 291]]

    - flow: Ткань
      on: Изготовление юбки
