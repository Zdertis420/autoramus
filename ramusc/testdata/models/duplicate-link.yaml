# Связь, записанная дважды: и списками ICOM, и явной записью в links (Р7).
#
# В файл при этом ехали две стрелки — параллельные линии с одной подписью и
# общими номерами узлов, из-за чего Ramus считал их одним узлом с двумя
# секторами. Отсюда и впечатление, что дубли наводит он сам.
#
# Предупреждение, а не ошибка: файл собрать можно и нужно, стрелка в нём одна.
model: Проверка дублей
flows: [Сырьё, Регламент, Мастер, Заготовка, Изделие]

functions:
  - name: Проверка дублей
    in:        [Сырьё]
    control:   [Регламент]
    mechanism: [Мастер]
    out:       [Изделие]

  - name: Первая
    of: Проверка дублей
    in:        [Сырьё]
    control:   [Регламент]
    mechanism: [Мастер]
    out:       [Заготовка]

  - name: Вторая
    of: Проверка дублей
    in:        [Заготовка]
    control:   [Регламент]
    mechanism: [Мастер]
    out:       [Изделие]

links:
  - flow: Заготовка
    from: Первая
    to: Вторая
    side: in
