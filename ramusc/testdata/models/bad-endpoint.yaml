# Концы сегментов описаны неверно: два вида сразу, ни одного вида, работа
# без стороны и узел, которому не с чем сшиваться.
model: Изготовление юбки
flows: [Ткань, Правила изготовления, Швея-закройщица, Юбка]

functions:
  - name: Изготовление юбки
    in:        [Ткань]
    control:   [Правила изготовления]
    mechanism: [Швея-закройщица]
    out:       [Юбка]

layout:
  arrows:
    - flow: Ткань
      segments:
        - on: Изготовление юбки
          from: {function: Изготовление юбки, border: left}
          to:   {}
          points: [[0, 0], [10, 0]]

        - on: Изготовление юбки
          from: {function: Изготовление юбки}
          to:   {node: одинокий}
          points: [[0, 0], [10, 0]]
