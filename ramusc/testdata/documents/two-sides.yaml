# Один поток приходит к работе двумя сторонами — и это не дубль.
#
# «Заготовка» входит во «Вторую» как вход (список in) и она же управляет ею
# (запись в links стороной control). Концы совпадают, поток совпадает, а
# стрелки разные: сторона приёмника входит в ключ, по которому раскладка
# схлопывает повторы, и по нему же валидатор их находит. Схлопнуть эти две
# значило бы потерять управление.
#
# Документ валиден и обязан давать две ветки, а не одну. Сегментов при этом
# три: поток выходит из «Первой» одним сектором до узла, и уже из узла
# расходится на вход и на управление «Второй». Прежде их было два — две линии
# от разных точек стороны с одной подписью на обеих.
model: Проверка сторон
flows: [Сырьё, Регламент, Мастер, Заготовка, Изделие]

functions:
  - name: Проверка сторон
    in:        [Сырьё]
    control:   [Регламент]
    mechanism: [Мастер]
    out:       [Изделие]

  - name: Первая
    of: Проверка сторон
    in:        [Сырьё]
    control:   [Регламент]
    mechanism: [Мастер]
    out:       [Заготовка]

  - name: Вторая
    of: Проверка сторон
    in:        [Заготовка]
    control:   [Регламент]
    mechanism: [Мастер]
    out:       [Изделие]

links:
  - flow: Заготовка
    from: Первая
    to: Вторая
    side: control
    note: Та же заготовка задаёт порядок сборки, а не только подаётся на вход
