model: Приготовление чахохбили
page: A4

flows: [
  Курица, Растительное масло, Лук, Помидоры, Вода,
  Хмели-сунели, Соль, Перец чёрный, Лавровый лист, Острый перец,
  Чеснок, Зелень,
  Рецепт приготовления чахохбили,
  Повар, Нож, Разделочная доска, Сковорода, Кастрюля, Плита, Блендер,
  Куски курицы, Обжаренная курица, Курица с луком,
  Помытые помидоры, Ошпаренные помидоры, Очищенные помидоры, Томатная масса,
  Тушёная курица, Чахохбили
]

functions:
  - name: Приготовление чахохбили
    in:        [Курица, Растительное масло, Лук, Помидоры, Вода,
                Хмели-сунели, Соль, Перец чёрный, Лавровый лист,
                Острый перец, Чеснок, Зелень]
    control:   [Рецепт приготовления чахохбили]
    mechanism: [Повар, Нож, Разделочная доска, Сковорода, Кастрюля, Плита, Блендер]
    out:       [Чахохбили]

  - name: Нарезка курицы
    of: Приготовление чахохбили
    in:        [Курица]
    control:   [Рецепт приготовления чахохбили]
    mechanism: [Повар, Нож, Разделочная доска]
    out:       [Куски курицы]

  - name: Обжарка курицы
    of: Приготовление чахохбили
    in:        [Куски курицы, Растительное масло]
    control:   [Рецепт приготовления чахохбили]
    mechanism: [Повар, Сковорода, Плита]
    out:       [Обжаренная курица]

  - name: Обжарка лука
    of: Приготовление чахохбили
    in:        [Обжаренная курица, Лук]
    control:   [Рецепт приготовления чахохбили]
    mechanism: [Повар, Сковорода, Плита]
    out:       [Курица с луком]

  - name: Подготовка томатной массы
    of: Приготовление чахохбили
    in:        [Помидоры, Вода]
    control:   [Рецепт приготовления чахохбили]
    mechanism: [Повар, Нож, Кастрюля, Плита, Блендер]
    out:       [Томатная масса]

  - name: Мытьё помидоров
    of: Подготовка томатной массы
    in:        [Помидоры]
    control:   [Рецепт приготовления чахохбили]
    mechanism: [Повар]
    out:       [Помытые помидоры]

  - name: Бланширование
    of: Подготовка томатной массы
    in:        [Помытые помидоры, Вода]
    control:   [Рецепт приготовления чахохбили]
    mechanism: [Повар, Кастрюля, Плита]
    out:       [Ошпаренные помидоры]
    note: 15-20 секунд в кипятке, затем сразу в холодную воду

  - name: Снятие кожицы
    of: Подготовка томатной массы
    in:        [Ошпаренные помидоры]
    control:   [Рецепт приготовления чахохбили]
    mechanism: [Повар, Нож]
    out:       [Очищенные помидоры]

  - name: Измельчение помидоров
    of: Подготовка томатной массы
    in:        [Очищенные помидоры]
    control:   [Рецепт приготовления чахохбили]
    mechanism: [Повар, Блендер]
    out:       [Томатная масса]

  - name: Тушение
    of: Приготовление чахохбили
    in:        [Курица с луком, Томатная масса,
                Хмели-сунели, Соль, Перец чёрный, Лавровый лист, Острый перец]
    control:   [Рецепт приготовления чахохбили]
    mechanism: [Повар, Сковорода, Плита]
    out:       [Тушёная курица]

  - name: Финальная приправка
    of: Приготовление чахохбили
    in:        [Тушёная курица, Чеснок, Зелень]
    control:   [Рецепт приготовления чахохбили]
    mechanism: [Повар]
    out:       [Чахохбили]
