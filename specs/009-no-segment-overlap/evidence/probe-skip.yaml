# Проба 4: связь, перешагивающая ровно один блок, и связь, перешагивающая два.
model: Проба4
flows: [вход, правила, руки, через1, через2, a1, a2, a3, выход]
functions:
  - name: Проба4
    in: [вход]
    control: [правила]
    mechanism: [руки]
    out: [выход]
  - name: Первая
    of: Проба4
    in: [вход]
    control: [правила]
    mechanism: [руки]
    out: [a1, через1, через2]
  - name: Вторая
    of: Проба4
    in: [a1]
    control: [правила]
    mechanism: [руки]
    out: [a2]
  - name: Третья
    of: Проба4
    in: [a2, через1]
    control: [правила]
    mechanism: [руки]
    out: [a3]
  - name: Четвёртая
    of: Проба4
    in: [a3, через2]
    control: [правила]
    mechanism: [руки]
    out: [выход]
