model: Изготовление юбки
author: ИП Воробьева
page: A4

# Р6: Все потоки должны быть объявлены заранее. 
# Любое имя, использованное ниже, есть в этом списке.
flows:
  - Ткань
  - Фурнитура
  - Правила изготовления швейного изделия
  - Швея-закройщица
  - Выкройка
  - Раскройное оборудование
  - Швейная машинка
  - Швейно-вышивальная машинка
  - Детали изделия
  - Собранное изделие
  - Юбка

# Р6/Р12: Дополнительная информация о потоках (комментарии) 
# хранится здесь, чтобы не засорять основной словарь.
streams:
  - name: Фурнитура
    note: Пуговицы, пряжка, аппликация

# Р3: Плоская структура. Иерархия задается полем 'of'.
# Р13: Полный ICOM у каждой работы. Механизмы детей есть у корня.
functions:
  # Контекстная диаграмма (A-0 / Корень)
  - name: Изготовление юбки
    in: [Ткань, Фурнитура]
    control: [Правила изготовления швейного изделия]
    mechanism: [Швея-закройщица, Раскройное оборудование, Выкройка, 
                Швейная машинка, Швейно-вышивальная машинка]
    out: [Юбка]

  # Декомпозиция (A0)
  - name: Раскрой материала
    of: Изготовление юбки
    in: [Ткань]
    control: [Правила изготовления швейного изделия]
    mechanism: [Швея-закройщица, Раскройное оборудование, Выкройка]
    out: [Детали изделия]

  - name: Сшивание деталей
    of: Изготовление юбки
    in: [Детали изделия]
    control: [Правила изготовления швейного изделия]
    mechanism: [Швея-закройщица, Швейная машинка]
    out: [Собранное изделие]

  - name: Добавление фурнитуры
    of: Изготовление юбки
    in: [Собранное изделие, Фурнитура]
    control: [Правила изготовления швейного изделия]
    mechanism: [Швея-закройщица, Швейно-вышивальная машинка]
    out: [Юбка]